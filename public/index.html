<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מענה יהודי</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 700px; padding: 20px; }
    h1 { text-align: center; color: #1565c0; margin-bottom: 20px; font-size: 1.8em; }
    /* מסך סיסמה */
    #login-screen { background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    #login-screen input { width: 200px; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; text-align: center; margin: 15px 0; }
    #login-screen button { padding: 12px 30px; font-size: 16px; background: #1565c0; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    #login-screen button:hover { background: #0d47a1; }
    #login-error { color: #d32f2f; margin-top: 10px; display: none; }
    /* מסך צ'אט */
    #chat-screen { display: none; }
    .chat-box { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); min-height: 400px; max-height: 70vh; overflow-y: auto; margin-bottom: 15px; }
    .message { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
    .user-msg { background: #e3f2fd; border-right: 4px solid #1565c0; }
    .bot-msg { background: #f5f5f5; border-right: 4px solid #4caf50; }
    .bot-msg strong { color: #1a1a50; }
    .input-row { display: flex; gap: 10px; }
    #question-input { flex: 1; padding: 14px; font-size: 15px; border: 2px solid #ddd; border-radius: 10px; resize: none; min-height: 50px; max-height: 150px; }
    #question-input:focus { border-color: #1565c0; outline: none; }
    #send-btn { padding: 14px 24px; font-size: 16px; background: #1565c0; color: #fff; border: none; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    #send-btn:hover { background: #0d47a1; }
    #send-btn:disabled { background: #999; cursor: not-allowed; }
    .loading { text-align: center; color: #666; padding: 20px; }
    .model-tag { font-size: 11px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- מסך כניסה -->
    <div id="login-screen">
      <h1>🔒 מענה יהודי</h1>
      <p>הכנס סיסמה:</p>
      <input type="password" id="password-input" autofocus>
      <br>
      <button onclick="login()">כניסה</button>
      <div id="login-error">סיסמה שגויה</div>
    </div>

    <!-- מסך צ'אט -->
    <div id="chat-screen">
      <h1>💬 מענה יהודי</h1>
      <div class="chat-box" id="chat-box"></div>
      <div class="input-row">
        <textarea id="question-input" placeholder="כתוב שאלה..." rows="1"></textarea>
        <button id="send-btn" onclick="ask()">שלח</button>
      </div>
    </div>
  </div>

  <script>
    let password = "";

    // כניסה
    document.getElementById('password-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    function login() {
      password = document.getElementById('password-input').value;
      // בדיקה מהירה מול השרת
      fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Password': password },
        body: JSON.stringify({ question: "בדיקה" })
      }).then(r => {
        if (r.status === 401) {
          document.getElementById('login-error').style.display = 'block';
        } else {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('chat-screen').style.display = 'block';
          document.getElementById('question-input').focus();
        }
      }).catch(() => {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('login-error').textContent = 'שגיאת חיבור';
      });
    }

    // שליחת שאלה
    document.getElementById('question-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    async function ask() {
      const input = document.getElementById('question-input');
      const question = input.value.trim();
      if (!question) return;

      const chatBox = document.getElementById('chat-box');
      const sendBtn = document.getElementById('send-btn');

      // הוספת הודעת משתמש
      chatBox.innerHTML += '<div class="message user-msg">' + escHtml(question) + '</div>';
      chatBox.innerHTML += '<div class="loading" id="loading">⏳ מחכה לתשובה...</div>';
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = '';
      sendBtn.disabled = true;

      try {
        const resp = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Password': password },
          body: JSON.stringify({ question })
        });
        const data = await resp.json();
        document.getElementById('loading').remove();

        if (data.error) {
          chatBox.innerHTML += '<div class="message bot-msg" style="color:#d32f2f;">❌ ' + escHtml(data.error) + '</div>';
        } else {
          chatBox.innerHTML += '<div class="message bot-msg">' + formatAnswer(data.answer) + '<div class="model-tag">' + (data.model || '') + '</div></div>';
        }
      } catch (e) {
        document.getElementById('loading')?.remove();
        chatBox.innerHTML += '<div class="message bot-msg" style="color:#d32f2f;">❌ שגיאת חיבור</div>';
      }

      chatBox.scrollTop = chatBox.scrollHeight;
      sendBtn.disabled = false;
      input.focus();
    }

    function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function formatAnswer(text) {
      // markdown בסיסי
      text = escHtml(text);
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/^## (.+)$/gm, '<h3 style="color:#1565c0;margin:12px 0 6px;">$1</h3>');
      text = text.replace(/^# (.+)$/gm, '<h2 style="color:#1565c0;margin:14px 0 8px;">$1</h2>');
      text = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#f5f5f5;padding:10px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;">$1</pre>');
      text = text.replace(/`([^`]+)`/g, '<code style="background:#f0f0f0;padding:2px 4px;border-radius:3px;">$1</code>');
      return text;
    }
  </script>
</body>
</html>
